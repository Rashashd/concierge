name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "refactor/**"
      - "docs/**"
      - "test/**"
      - "chore/**"
      - "rasha/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check app tests

      - name: Unit tests
        run: uv run pytest tests/unit -q

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardrails
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check app

      - name: Unit tests
        run: |
          if [ -d tests ]; then
            uv run pytest -q
          else
            echo "No guardrails tests in this branch; skipping."
          fi

  model-server:
    name: Model Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff
        run: uvx ruff check app

  widget:
    name: Widget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
