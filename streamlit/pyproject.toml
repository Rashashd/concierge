[project]
name = "concierge-admin"
version = "0.1.0"
description = "Streamlit admin UI for Concierge"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.37.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0"
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true