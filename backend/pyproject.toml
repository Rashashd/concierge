[project]
name = "concierge-backend"
version = "0.1.0"
description = "Concierge FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Auth
    "fastapi-users[sqlalchemy]>=13.0.0",
    "pyjwt>=2.9.0",
    # Config + validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # HTTP client
    "httpx>=0.27.0",
    # Retries
    "tenacity>=9.0.0",
    # Secrets
    "hvac>=2.3.0",
    # Redis session memory
    "redis[asyncio]>=5.0.0",
    # Blob storage (MinIO is S3-compatible)
    "boto3>=1.34.0",
    # LLM + agent
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0,<0.3.0",
    # PII redaction
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Logging
    "structlog>=24.4.0",
    "psycopg2-binary>=2.9.12",
    "cohere>=7.0.0",
]

[dependency-groups]
dev = [
    "datasets>=4.8.5",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ragas>=0.4.3",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hvac", "hvac.*", "pgvector", "pgvector.*", "boto3", "boto3.*", "botocore", "botocore.*", "presidio_analyzer", "presidio_analyzer.*", "presidio_anonymizer", "presidio_anonymizer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
